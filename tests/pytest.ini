[pytest]
testpaths = suites
addopts = -ra --strict-markers --alluredir=allure-results
markers =
    smoke: основной путь покупки, запускается на каждый коммит
    lifecycle: поворот, фон, гибель процесса
    network: офлайн, таймауты, ошибки сервера
    permissions: системные разрешения
    a11y: доступность
    l10n: локализация
    stub_only: нужен сервер-заглушка (сбои по команде теста), против настоящего shop-api пропускается
